<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grove Supply · Seller Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/admin.js"></script>
</head>
<body>
  <header class="header"><a class="brand" href="/">Grove Supply<span>.</span></a><nav><a href="/">Storefront</a></nav></header>
  <main class="admin">
    <p class="eyebrow">Grove Supply / Seller workspace</p>
    <h1>Store dashboard</h1>
    <form id="unlock"><label for="token">Dashboard access token</label><div class="form-row"><input type="password" id="token" autocomplete="off" required><button>Load dashboard</button></div></form>
    <p role="status" id="status"></p>
    <div id="overview" hidden>
      <div class="metrics"><article><p>Demo orders</p><strong id="count"></strong></article><article><p>Order subtotal</p><strong id="total"></strong></article><article><p>Units in stock</p><strong id="stock"></strong></article></div>
      <section><h2>Inventory</h2><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>In stock</th></tr></thead><tbody id="inventory"></tbody></table></div></section>
      <section><h2>Recent demo orders</h2><p id="empty-orders" hidden>No confirmed orders yet.</p><div class="table-wrap"><table id="orders-table"><thead><tr><th>Reference</th><th>Product</th><th>Quantity</th><th>Subtotal</th><th>Placed</th></tr></thead><tbody id="orders"></tbody></table></div></section>
    </div>
  </main>
</body>
</html>
